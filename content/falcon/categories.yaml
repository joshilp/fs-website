retro:
  label: Retro
  intro: >-
    Retro rooms are ground-floor units in Falcon's original motel wing — classic Osoyoos
    lakeside lodging with straightforward, comfortable character. Step outside and set up
    chairs in front of your room when lake breezes pick up, or spread out in the large
    lot with your group. Same private beach, outdoor pool, and shared grounds as the rest
    of the property.

beachside:
  label: Beachside
  intro: >-
    Beachside rooms sit near Osoyoos Lake — a short walk to our private sandy beach,
    outdoor pool, and BBQ area.

beachfront:
  label: Beachfront
  intro: >-
    Beachfront suites face the lake — our closest rooms to the water, with quick access
    to the private beach and pool.
